[project]
name = "models-character-controller"
version = "0.1.0"
description = "Control the assigned Models character through the Player API to win matches."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "websockets>=15,<18",
]

[dependency-groups]
dev = ["ruff>=0.11,<1"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
